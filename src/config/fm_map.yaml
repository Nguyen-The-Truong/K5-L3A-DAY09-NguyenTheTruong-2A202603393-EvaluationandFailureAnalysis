# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
# All 8 mechanisms already have a row in docs/failure_taxonomy.md, so no new FM was needed.
ticket_over_db: FM-03          # prompt injection / false fact in the ticket beats the DB delay_days
stale_policy: FM-06            # superseded or not-yet-effective clause cited by the customer
clause_sum: FM-04              # asked to add clauses together instead of taking the larger one
double_deduct: FM-05           # prior refund on the order subtracted twice (shape + host)
sibling_refund: FM-07          # batch request spills money onto sibling claims
denied_ignored: FM-02          # host denial (expired approval / order already refunded) reported as success
reply_ledger_mismatch: FM-08   # approval caps the refund below the quote; reply must state the capped amount
cross_principal: FM-09         # another principal's order / PII requested
